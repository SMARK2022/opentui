name: Build Native Packages

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact name shared with caller verification jobs
        required: true
        type: string
    outputs:
      version:
        description: Version read from the lockstep package manifests
        value: ${{ jobs.build-native.outputs.version }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 26.3.0
  ZIG_VERSION: 0.15.2

jobs:
  build-native:
    name: Build and Pack OpenTUI
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Read release version
        id: version
        run: |
          VERSION=$(bun -e 'console.log((await Bun.file("packages/core/package.json").json()).version)')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install source dependencies
        run: bun install --frozen-lockfile --omit=optional --linker=hoisted

      - name: Run #845 focused native regression
        working-directory: packages/core/src/zig
        run: zig build test --summary all -Dtest-filter="TextBufferView word wrapping - CJK boundary keeps byte and column offsets aligned"

      - name: Run native regression suite
        working-directory: packages/core
        run: bun run test:native

      - name: Cross-build package closure
        run: |
          # 8个native必须由同一source commit一次生成，不能混用registry中的旧binary。
          # optional packages在source install阶段省略，build:native是唯一native producer。
          bun run --cwd packages/core build:native --all
          bun run --cwd packages/core build:lib
          bun run --cwd packages/solid build
          bun run --cwd packages/keymap build

      - name: Run JavaScript and framework suites
        run: |
          # source suites验证owner算法及Solid/keymap生态，pack verifier再验证真正consumer边界。
          bun run --cwd packages/core test:js
          bun run --cwd packages/solid test
          bun run --cwd packages/keymap test

      - name: Run packed Node smoke suites
        run: |
          bun run --cwd packages/core test:dist --skip-build
          bun run --cwd packages/solid test:dist --skip-build
          bun run --cwd packages/keymap test:dist --skip-build

      - name: Pack eleven npm-compatible assets
        run: |
          set -euo pipefail
          mkdir -p artifacts/npm-packages
          # npm pack是上游release已验证的package contract；Bun pack不能解析dist中的workspace dev metadata。
          npm pack --pack-destination artifacts/npm-packages ./packages/core/dist
          npm pack --pack-destination artifacts/npm-packages ./packages/solid/dist
          npm pack --pack-destination artifacts/npm-packages ./packages/keymap/dist
          for package in packages/core/node_modules/@opentui/core-*; do
            npm pack --pack-destination artifacts/npm-packages "$package"
          done
          test "$(find artifacts/npm-packages -name '*.tgz' -type f | wc -l | tr -d ' ')" = "11"
          # 清单必须保存basename；verifier和GitHub Release asset名都以该basename寻址。
          (cd artifacts/npm-packages && shasum -a 256 *.tgz > SHA256SUMS)

      - name: Verify packed release behavior
        run: |
          # verifier通过HTTP重新安装tarballs，防止source tests掩盖package metadata或native闭包错误。
          bun scripts/verify-release-packages.ts \
            --directory artifacts/npm-packages \
            --version "${{ steps.version.outputs.value }}"

      - name: Upload package closure
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: artifacts/npm-packages/
          if-no-files-found: error
          retention-days: 7

name: SMARK Immutable Release

on:
  push:
    tags:
      - "v*-smark.*"

permissions:
  contents: write

jobs:
  prepare:
    name: Validate Release Source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact-name: ${{ steps.release.outputs.artifact-name }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate tag and lockstep versions
        id: release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # tag必须来自已push的SMARK主分支，避免release与submodule可发现source脱节。
          git fetch origin smark/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/smark/main
          VERSION="$VERSION" bun -e '
            const files = await Array.fromAsync(new Bun.Glob("packages/*/package.json").scan())
            for (const file of files) {
              const pkg = await Bun.file(file).json()
              if (typeof pkg.name === "string" && pkg.name.startsWith("@opentui/") && pkg.version !== process.env.VERSION) {
                throw new Error(`${file}: ${pkg.version} != ${process.env.VERSION}`)
              }
            }
          '
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact-name=release-packages-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  packages:
    name: Build Release Closure
    needs: prepare
    uses: ./.github/workflows/build-native.yml
    with:
      artifact-name: ${{ needs.prepare.outputs.artifact-name }}

  verify:
    name: Verify Release (${{ matrix.os }})
    needs: [prepare, packages]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download package closure
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}
          path: artifacts/npm-packages

      - name: Verify installed package behavior
        run: >-
          bun scripts/verify-release-packages.ts
          --directory artifacts/npm-packages
          --version "${{ needs.prepare.outputs.version }}"

  publish:
    name: Publish Immutable GitHub Release
    needs: [prepare, packages, verify]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified package closure
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}
          path: artifacts/npm-packages

      - name: Require repository release immutability
        run: |
          # immutable setting是发布前置，不允许先发布普通release再事后补保护。
          test "$(gh api "repos/$GH_REPO/immutable-releases" --jq .enabled)" = "true"

      - name: Create complete draft release
        run: |
          # 先把12个assets放入draft，publish后GitHub会同时锁定tag和assets并生成attestation。
          gh release create "$GITHUB_REF_NAME" artifacts/npm-packages/* \
            --draft \
            --verify-tag \
            --prerelease \
            --title "OpenTUI $GITHUB_REF_NAME (SMARK)" \
            --notes "OpenTUI v0.4.3 with anomalyco/opentui#845, built from SMARK2022/opentui:smark/main. Windows DLL assets are unsigned."

      - name: Publish immutable release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease

name: SMARK Immutable Release

on:
  push:
    tags:
      - "v*-smark.*"
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing immutable release tag to publish
        required: true
        type: string
      source-sha:
        description: Exact source commit named by the release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Validate Release Source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact-name: ${{ steps.release.outputs.artifact-name }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      source-sha: ${{ steps.release.outputs.source-sha }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate tag and lockstep versions
        id: release
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ inputs.release-tag || github.ref_name }}"
          SOURCE_SHA="${{ inputs.source-sha || github.sha }}"
          VERSION="${RELEASE_TAG#v}"
          # tag必须来自已push的SMARK主分支，避免release与submodule可发现source脱节。
          git fetch origin smark/main --tags
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/smark/main
          # 同一tag只能发布一次；dispatch retry必须在draft创建前确认没有release。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="$VERSION" bun -e '
            const files = await Array.fromAsync(new Bun.Glob("packages/*/package.json").scan())
            for (const file of files) {
              const pkg = await Bun.file(file).json()
              if (typeof pkg.name === "string" && pkg.name.startsWith("@opentui/") && pkg.version !== process.env.VERSION) {
                throw new Error(`${file}: ${pkg.version} != ${process.env.VERSION}`)
              }
            }
          '
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact-name=release-packages-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  packages:
    name: Build Release Closure
    needs: prepare
    uses: ./.github/workflows/build-native.yml
    with:
      artifact-name: ${{ needs.prepare.outputs.artifact-name }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}

  verify:
    name: Verify Release (${{ matrix.os }})
    needs: [prepare, packages]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download package closure
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}
          path: artifacts/npm-packages

      - name: Verify installed package behavior
        run: >-
          bun scripts/verify-release-packages.ts
          --directory artifacts/npm-packages
          --version "${{ needs.prepare.outputs.version }}"

  publish:
    name: Publish Immutable GitHub Release
    needs: [prepare, packages, verify]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified package closure
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}
          path: artifacts/npm-packages

      - name: Create complete draft release
        run: |
          # 先把12个assets放入draft，publish后GitHub会同时锁定tag和assets并生成attestation。
          gh release create "${{ needs.prepare.outputs.release-tag }}" artifacts/npm-packages/* \
            --draft \
            --verify-tag \
            --prerelease \
            --title "OpenTUI ${{ needs.prepare.outputs.release-tag }} (SMARK)" \
            --notes "OpenTUI ${{ needs.prepare.outputs.release-tag }} with the streaming Markdown persistent-tree and stable-prefix caching fixes, built from SMARK2022/opentui:smark/main. Windows DLL assets are unsigned."

      - name: Publish immutable release
        run: gh release edit "${{ needs.prepare.outputs.release-tag }}" --draft=false --prerelease
